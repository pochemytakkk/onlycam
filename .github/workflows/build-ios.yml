name: Build iPhone IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned app
        working-directory: onlycam/ios
        run: |
          xcodebuild \
            -project OnlyCam.xcodeproj \
            -scheme OnlyCam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        working-directory: onlycam/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OnlyCam.app Payload/
          zip -qry OnlyCam.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OnlyCam
          path: onlycam/ios/OnlyCam.ipa
